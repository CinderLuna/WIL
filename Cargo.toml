[workspace]
resolver = "2"
members = [
    "crates/wml-diagnostics",
    "crates/wml-syntax",
    "crates/wml-hir",
    "crates/wml-mir",
    "crates/wml-runtime",
    "crates/wml-codegen-cranelift",
    "crates/wml-codegen-llvm",
    "crates/wml-client",
    "crates/wml-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["WML Core Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
la-arena = "0.3"
logos = "0.14"
ariadne = "0.4"
httparse = "1.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
